    compileSdk 35

    defaultConfig {
        applicationId 'org.telesin.buttonlab'
        minSdk 33
        targetSdk 35
        versionCode 20
        versionName '2.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
