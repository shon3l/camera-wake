plugins { id 'com.android.application' }

android {
    namespace 'org.telesin.buttonlab'
    compileSdk 35

    defaultConfig {
        applicationId 'org.telesin.buttonlab'
        minSdk 29
        targetSdk 35
        versionCode 10
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
